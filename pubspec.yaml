name: sigma_music
description: A cross-platform Flutter music player with plugin-based provider architecture.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client with interceptors and retry
  dio: ^5.7.0
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  # Audio playback
  just_audio: ^0.9.41
  audio_service: ^0.18.15
  # Routing
  go_router: ^14.6.0
  # Storage
  hive_flutter: ^1.1.0
  # Freezed for immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
